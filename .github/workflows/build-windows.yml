# Builds the Windows app on a Windows PC in the cloud.
# Makes TranslatorSetup.exe (installer) and Translator-portable.zip (no install needed).
name: Build Windows app

on:
  workflow_dispatch:      # "Run workflow" button on the Actions tab
  push:
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write         # lets the build publish the installer as a download

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.16.0

      - name: Draw the app icon
        run: python make_icon.py

      - name: Package Translator.exe
        run: |
          pyinstaller --noconfirm --clean --windowed `
            --name Translator `
            --icon translator.ico `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all _sounddevice_data `
            --hidden-import pystray._win32 `
            --hidden-import win32com.client `
            --hidden-import pythoncom `
            translator_app.py

      - name: Check the packaged app can load a speech model and translate
        run: |
          $p = Start-Process -FilePath "dist\Translator\Translator.exe" -ArgumentList "--selftest" `
                -WorkingDirectory $PWD -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path selftest.txt -Pattern "SELFTEST OK" -Quiet)) {
            throw "Self test failed (exit code $($p.ExitCode))"
          }

      - name: Check the window, tray icon and hotkey start without crashing
        run: |
          $p = Start-Process -FilePath "dist\Translator\Translator.exe" -ArgumentList "--smoketest" `
                -WorkingDirectory $PWD -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "App did not close by itself" }
          $log = Join-Path $env:LOCALAPPDATA "Translator\error.log"
          if (Test-Path $log) { Get-Content $log; throw "App logged an error" }
          if (-not (Test-Path smoketest.txt)) { throw "App did not finish its check (exit code $($p.ExitCode))" }
          Get-Content smoketest.txt

      - name: Make the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path dist\Translator -DestinationPath dist\Translator-portable.zip
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Translator-Windows
          path: |
            windows/dist/TranslatorSetup.exe
            windows/dist/Translator-portable.zip
          retention-days: 30

      - name: Publish as the "windows-latest" download
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag 2>$null
          $sha = "${{ github.sha }}".Substring(0, 7)
          gh release create windows-latest dist\TranslatorSetup.exe dist\Translator-portable.zip `
            --target "${{ github.sha }}" `
            --latest=false `
            --title "Translator for Windows (latest build)" `
            --notes "Built from $sha. Download TranslatorSetup.exe below, open it, and follow the steps."
