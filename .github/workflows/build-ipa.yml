# Builds the iPhone app on a Mac in the cloud and saves it as Translator.ipa.
# The .ipa is unsigned. Sideloadly signs it with your free Apple ID when you install it from Windows.
name: Build iPhone app

on:
  workflow_dispatch:      # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths-ignore:          # Windows and web app changes don't need a new iPhone build
      - "windows/**"
      - ".github/workflows/build-windows.yml"
      - "web/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: write         # lets the build publish Translator.ipa as a download

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project VoiceTranslator.xcodeproj \
            -target VoiceTranslator \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Translator.ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/VoiceTranslator.app Payload/
          ls Payload/VoiceTranslator.app/PlugIns || true
          zip -qry Translator.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Translator-ipa
          path: Translator.ipa
          retention-days: 30

      - name: Publish as the "latest" download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Translator.ipa \
            --title "Translator (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download Translator.ipa below and install it with Sideloadly."
