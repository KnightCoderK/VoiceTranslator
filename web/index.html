<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Translator</title>
  <meta name="description" content="Live voice translation from Japanese or Brazilian Portuguese into English.">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Translator">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Translator</h1>
    <div class="langs" role="radiogroup" aria-label="Language you will hear">
      <button type="button" class="lang" data-lang="ja" role="radio">🇯🇵 Japanese</button>
      <button type="button" class="lang" data-lang="pt" role="radio">🇧🇷 Portuguese</button>
    </div>
  </header>

  <main id="feed" aria-live="polite">
    <div id="empty" class="empty">
      <p>Speak Japanese or Portuguese near the microphone. The English shows up here.</p>
    </div>
    <div id="live" class="live" hidden></div>
  </main>

  <div id="notice" class="notice" hidden></div>

  <footer class="bar">
    <button type="button" id="speak" class="side" aria-pressed="false" title="Read the English aloud">
      <span class="ico" aria-hidden="true">🔈</span><span class="lbl">Read aloud</span>
    </button>
    <button type="button" id="mic" class="mic" aria-pressed="false" title="Start or stop (Space)">
      <span class="ring" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button type="button" id="clear" class="side" title="Clear the screen">
      <span class="ico" aria-hidden="true">🗑</span><span class="lbl">Clear</span>
    </button>
  </footer>
  <p id="status" class="status">Starting…</p>

  <script src="app.js"></script>
</body>
</html>
